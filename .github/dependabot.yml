version: 2
# Every update waits 7 days after release (matches min-release-age in .npmrc), so a
# compromised release has time to be caught before it reaches this repo.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
