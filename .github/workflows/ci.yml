name: ci
# Runs on every PR and every branch push, with a read-only token and no secrets. Nothing here
# can publish anything: the site is deployed only by pages.yml, from main's code.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Build the page (structure check, game lint, CSP hashes)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build.py --out "dist/micro-tactics-${HEAD_SHA:0:7}.html"
      - name: Upload the page as a single-file download
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/micro-tactics-*.html
          archive: false
          retention-days: 30
      - name: Link the download
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Download this build"
            echo "[micro-tactics HTML file]($URL). Open it in any browser; it runs offline."
            echo
            echo "Built with this branch's own copy of the tools. For a PR, the preview comment links a copy built with main's tools."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  # Firefox and WebKit pass but don't block yet, until they've been stable for a while. To make
  # them required, drop continue-on-error and add both checks to the main ruleset.
  test-other-browsers:
    name: test (${{ matrix.browser }}, not required)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright install --with-deps "$BROWSER"
          npx playwright test --project="$BROWSER"

  agent-scope:
    name: agent scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Agent PRs may only change game files
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # An agent PR is one on a claude/ branch, or with a commit by claude[bot]. It may change
          # only game.html, tests/game/ and README.md. Everything else is the owner's, so changes
          # there come from the owner, in a separate PR. CODEOWNERS covers every other PR.
          set -euo pipefail
          if [[ "$HEAD_REF" != claude/* ]] && ! git log --format='%an %ae %cn %ce %b' "$BASE_SHA..$HEAD_SHA" | grep -q 'claude\[bot\]'; then
            echo "Not an agent PR."
            exit 0
          fi
          outside=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -vE '^(game\.html|README\.md|tests/game/.*)$' || true)
          if [[ -n "$outside" ]]; then
            echo "::error::Agent PRs may change only game.html, tests/game/ and README.md. These changes are outside that:"
            echo "$outside"
            exit 1
          fi
          echo "This agent PR changes only game files."

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r tools/requirements-ci.txt
      - run: zizmor --offline --format github .github/workflows
